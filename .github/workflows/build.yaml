name: Build Taskbar + ClipSync
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restructure uploaded files
        run: bash restructure.sh
      - name: Add ClipSync to Taskbar
        run: python3 patch_taskbar.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assembleFreeDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Taskbar-ClipSync
          path: app/build/outputs/apk/free/debug/*.apk
